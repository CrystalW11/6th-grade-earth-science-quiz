<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rocks & Minerals Flashcard Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🌍 Rocks & Minerals Quiz</h1>

  <div id="quiz-container">
    <p id="progress"></p>
    <p id="question-text"></p>
    <div id="answers"></div>
    <p id="feedback"></p>

    <div class="controls">
      <button id="next-btn">Next</button>
      <button id="submit-btn">Submit</button>
    </div>

    <p id="score"></p>
    <h2 id="result"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
